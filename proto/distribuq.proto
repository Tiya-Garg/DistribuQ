syntax = "proto3";

package distribuq;

option go_package = "github.com/Tiya-Garg/DistribuQ/proto;distribuq";

// -------------------------------------------------------------
// Raft Service (Inter-scheduler consensus & replication)
// -------------------------------------------------------------

message LogEntry {
  int64 index = 1;
  int64 term = 2;
  string type = 3;
  string task_id = 4;
  string payload = 5;
  string worker_id = 6;
  string cause = 7;
  int32 priority = 8;
  string required_tag = 9;
}

message RequestVoteRequest {
  int64 term = 1;
  string candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  int64 term = 1;
  string leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  int64 match_index = 3;
  int64 conflict_term = 4;
  int64 conflict_index = 5;
}

message InstallSnapshotRequest {
  int64 term = 1;
  string leader_id = 2;
  int64 last_included_index = 3;
  int64 last_included_term = 4;
  bytes data = 5;
}

message InstallSnapshotResponse {
  int64 term = 1;
}

service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// -------------------------------------------------------------
// Scheduler Service (Client and Worker communication)
// -------------------------------------------------------------

message RegisterWorkerRequest {
  string worker_id = 1;
  string addr = 2;
  repeated string tags = 3;
  int32 max_concurrent = 4;
}

message RegisterWorkerResponse {
  bool ok = 1;
}

message HeartbeatRequest {
  string worker_id = 1;
  int32 active_tasks = 2;
  double cpu_usage = 3;
}

message HeartbeatResponse {
  bool ok = 1;
}

message SubmitTaskRequest {
  string task_id = 1;
  string payload = 2;
  int32 priority = 3;
  string required_tag = 4;
}

message SubmitTaskResponse {
  bool ok = 1;
}

message CompleteTaskRequest {
  string task_id = 1;
  string worker_id = 2;
}

message CompleteTaskResponse {
  bool ok = 1;
}

message FailTaskRequest {
  string task_id = 1;
  string worker_id = 2;
  string cause = 3;
}

message FailTaskResponse {
  bool ok = 1;
}

message GetStatusRequest {}

message GetStatusResponse {
  map<string, string> tasks = 1;
  int32 worker_count = 2;
}

message DrainWorkerRequest {
  string worker_id = 1;
}

message DrainWorkerResponse {
  bool ok = 1;
}

enum TaskState {
  QUEUED = 0;
  ASSIGNED = 1;
  RUNNING = 2;
  COMPLETED = 3;
  FAILED = 4;
  DLQ = 5;
}

message TaskInfo {
  string id = 1;
  string payload = 2;
  string status = 3;
  string worker_id = 4;
  int32 attempts = 5;
  int32 max_retries = 6;
  int32 priority = 7;
  string required_tag = 8;
  string last_error = 9;
}

message ReplayDLQRequest {
  string task_id = 1;
}

message ReplayDLQResponse {
  bool ok = 1;
}

message PurgeDLQRequest {
  string task_id = 1;
}

message PurgeDLQResponse {
  bool ok = 1;
}

message GetDLQRequest {}

message GetDLQResponse {
  repeated TaskInfo tasks = 1;
}

service SchedulerService {
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc DrainWorker(DrainWorkerRequest) returns (DrainWorkerResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc SubmitTask(SubmitTaskRequest) returns (SubmitTaskResponse);
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse);
  rpc FailTask(FailTaskRequest) returns (FailTaskResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetDLQ(GetDLQRequest) returns (GetDLQResponse);
  rpc ReplayDLQ(ReplayDLQRequest) returns (ReplayDLQResponse);
  rpc PurgeDLQ(PurgeDLQRequest) returns (PurgeDLQResponse);
}

// -------------------------------------------------------------
// Worker Service (Task execution pushed from Scheduler)
// -------------------------------------------------------------

message ExecuteTaskRequest {
  string task_id = 1;
  string payload = 2;
}

message ExecuteTaskResponse {
  bool accepted = 1;
}

service WorkerService {
  rpc ExecuteTask(ExecuteTaskRequest) returns (ExecuteTaskResponse);
}
