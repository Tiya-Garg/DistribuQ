<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DistribuQ UI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Hero Section -->
  <section class="hero" style="margin-bottom: 2rem; text-align:center;">
    <h1 style="font-size:2.5rem; margin-bottom:0.5rem;">DistribuQ</h1>
    <p style="font-size:1.2rem; opacity:0.8;">A premium distributed queue manager</p>
    <a href="#" class="button" id="primary-button">Get Started</a>
  </section>

  <!-- Sample Card -->
  <div class="card" id="sample-card">
    <h3>Quick Overview</h3>
    <p>Monitor your queues, schedule jobs, and observe worker health in real‑time.</p>
  </div>

  <!-- Modal placeholder (hidden) -->
  <div class="modal-overlay" id="demo-modal">
    <div class="modal">
      <button class="modal-close" id="modal-close">&times;</button>
      <h2>Welcome!</h2>
      <p>This is a demonstration modal using the premium design system.</p>
    </div>
  </div>

  <script>
    // Simple demo: open modal on button click
    const btn = document.getElementById('primary-button');
    const modal = document.getElementById('demo-modal');
    const closeBtn = document.getElementById('modal-close');
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      modal.classList.add('active');
    });
    closeBtn.addEventListener('click', () => modal.classList.remove('active'));
    // Close when clicking outside modal content
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });
  </script>
</body>
</html>
